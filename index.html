<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><link rel="manifest" href="manifest.json"><title>مسیر من</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#172033;background:#f3f5f9}*{box-sizing:border-box}body{margin:0;padding:18px;max-width:760px;margin:auto}header{padding:18px;background:#172554;color:white;border-radius:16px;margin-bottom:16px}h1{margin:0 0 8px;font-size:24px}input,textarea,select,button{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:10px;width:100%;margin:6px 0}button{background:#1d4ed8;color:white;border:0;cursor:pointer}.item{background:white;border:1px solid #e2e8f0;padding:12px;border-radius:12px;margin:10px 0;overflow-wrap:anywhere}.muted{color:#64748b;font-size:13px}.danger{background:#b91c1c}.row{display:flex;gap:8px}.row>*{flex:1}body.dark{background:#111827;color:#e5e7eb}body.dark .item{background:#1f2937;border-color:#374151}body.dark input,body.dark textarea,body.dark select{background:#1f2937;color:white;border-color:#4b5563}
</style></head>
<body><header><h1>مسیر من</h1><div>دفتر امن اطلاعات شخصی شما</div></header>
<section id="setup"><h3>ساخت رمز اصلی</h3><p class="muted">این رمز برای رمزگذاری اطلاعات شماست. آن را فراموش نکنید.</p><input id="master" type="password" placeholder="رمز اصلی (حداقل ۸ نویسه)"><button id="unlock">ورود / ساخت گاوصندوق</button></section>
<section id="app" hidden><div class="row"><button id="theme">تغییر حالت روشن/تاریک</button><button id="backup">خروجی پشتیبان رمزگذاری‌شده</button></div><input id="search" placeholder="جستجو"><select id="kind"><option>یادداشت</option><option>سند</option><option>اطلاعات شخصی</option><option>رمز عبور</option><option>هزینه</option><option>لینک</option><option>سایر</option></select><input id="title" placeholder="عنوان"><textarea id="body" rows="4" placeholder="متن یا اطلاعات موردنظر"></textarea><button id="add">ذخیره رمزگذاری‌شده</button><div id="items"></div></section>
<script>
const enc=new TextEncoder(),dec=new TextDecoder();let key,records=[];const $=id=>document.getElementById(id);
async function derive(pass,salt){let base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(obj){let iv=crypto.getRandomValues(new Uint8Array(12));let data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));return {iv:Array.from(iv),data:Array.from(new Uint8Array(data))}}
async function openBox(box){let plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(box.iv)},key,new Uint8Array(box.data));return JSON.parse(dec.decode(plain))}
async function refresh(){let q=$('search').value.toLowerCase();$('items').innerHTML='';for(let i=records.length-1;i>=0;i--){let r=records[i];if((r.title+' '+r.body+' '+r.kind).toLowerCase().includes(q)){let d=document.createElement('div');d.className='item';let h=document.createElement('b');h.textContent=r.title+' — '+r.kind;let p=document.createElement('p');p.textContent=r.body;let b=document.createElement('button');b.className='danger';b.textContent='حذف';b.onclick=async()=>{records.splice(i,1);await save();refresh()};d.append(h,p,b);$('items').append(d)}}}
async function save(){let box=await seal(records);localStorage.setItem('masirman_v1',JSON.stringify(box))}
$('unlock').onclick=async()=>{try{let pass=$('master').value;if(pass.length<8)return alert('رمز باید حداقل ۸ نویسه باشد');let stored=localStorage.getItem('masirman_v1');if(stored){let box=JSON.parse(stored);key=await derive(pass,new Uint8Array(box.salt));records=await openBox(box.payload)}else{let salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pass,salt);let payload=await seal([]);localStorage.setItem('masirman_v1',JSON.stringify({salt:Array.from(salt),payload}));records=[]}$('setup').hidden=true;$('app').hidden=false;refresh()}catch(e){alert('رمز اشتباه است یا داده‌ها قابل خواندن نیستند.')}};
$('add').onclick=async()=>{if(!$('title').value.trim())return alert('عنوان را وارد کنید');records.push({kind:$('kind').value,title:$('title').value,body:$('body').value});await save();$('title').value='';$('body').value='';refresh()};$('search').oninput=refresh;$('theme').onclick=()=>document.body.classList.toggle('dark');$('backup').onclick=()=>{let blob=new Blob([localStorage.getItem('masirman_v1')],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='masir-man-backup.json';a.click();URL.revokeObjectURL(a.href)};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
